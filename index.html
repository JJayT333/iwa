<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Into Action Group</title>
  <meta name="description" content="Into Action Group — meeting info, schedule, prayers, and resources. One day at a time.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B1E36">

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Into Action">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" href="icons/favicon.ico" sizes="any">

  <!-- Display font (progressive: falls back to Georgia offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="topbar"></div>
    <main id="content"></main>
    <nav id="tabbar"></nav>
    <div id="banner"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
